name: Hermes Agent (Docker)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: hermes-docker-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  packages: read

jobs:
  run:
    if: >-
      (github.event_name == 'issues' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HERMES_HOME: ${{ github.workspace }}/.hermes
      HERMES_WORKSPACE: ${{ github.workspace }}
      CF_MODEL: ${{ vars.CF_MODEL || '@cf/zai-org/glm-4.7-flash' }}
      HERMES_IMAGE: ghcr.io/${{ github.repository_owner }}/codespaces-blank:latest
      HERMES_NETWORK: hermes-${{ github.run_id }}
      HERMES_PROXY_CONTAINER: hermes-proxy-${{ github.run_id }}
      HERMES_AGENT_CONTAINER: hermes-agent-${{ github.run_id }}
      HERMES_WEBUI_CONTAINER: hermes-webui-${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Hermes Docker services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
          printf 'API_SERVER_KEY=%s\n' "$(openssl rand -hex 24)" >> "${GITHUB_ENV}"
          printf '%s' "${GITHUB_TOKEN}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker pull "${HERMES_IMAGE}"
          docker network create "${HERMES_NETWORK}"
          docker run -d --name "${HERMES_PROXY_CONTAINER}" \
            --network "${HERMES_NETWORK}" \
            --entrypoint python3 \
            -e CF_PROXY_HOST=0.0.0.0 \
            -e CF_PROXY_PORT=8788 \
            -e CF_MODEL \
            "${HERMES_IMAGE}" /opt/hermes/cf-proxy.py
          docker run -d --name "${HERMES_AGENT_CONTAINER}" \
            --network "${HERMES_NETWORK}" \
            -w /workspace \
            -v "${HERMES_HOME}:/opt/data" \
            -v "${HERMES_WORKSPACE}:/workspace" \
            -e HERMES_HOME=/opt/data \
            -e HERMES_WRITE_SAFE_ROOT=/opt/data \
            -e HERMES_UID="$(id -u)" \
            -e HERMES_GID="$(id -g)" \
            -e API_SERVER_HOST=0.0.0.0 \
            -e API_SERVER_KEY="${API_SERVER_KEY:-}" \
            "${HERMES_IMAGE}" gateway run
          docker run -d --name "${HERMES_WEBUI_CONTAINER}" \
            --network "${HERMES_NETWORK}" \
            -v "${HERMES_HOME}:/home/hermeswebui/.hermes" \
            -v "${HERMES_WORKSPACE}:/workspace" \
            -e WANTED_UID="$(id -u)" \
            -e WANTED_GID="$(id -g)" \
            -e HERMES_WEBUI_HOST=0.0.0.0 \
            -e HERMES_WEBUI_PORT=8787 \
            -e HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui \
            -e HERMES_WEBUI_DEFAULT_WORKSPACE=/workspace \
            -e HERMES_WEBUI_CHAT_BACKEND=gateway \
            -e HERMES_WEBUI_GATEWAY_BASE_URL=http://${HERMES_AGENT_CONTAINER}:8642 \
            -e HERMES_WEBUI_GATEWAY_API_KEY="${API_SERVER_KEY:-}" \
            -e HERMES_WEBUI_GATEWAY_USE_RUNS_API=true \
            "${HERMES_IMAGE}"

      - name: Verify Cloudflare proxy
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if docker exec "${HERMES_PROXY_CONTAINER}" python3 -c \
              'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8788/health")'; then
              break
            fi
            [[ "${attempt}" == 30 ]] && exit 1
            sleep 1
          done
          docker exec "${HERMES_PROXY_CONTAINER}" python3 -c \
            'import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8788/v1/models"); print(response.read().decode())'

      - name: Run Hermes in Docker
        id: hermes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          issue_title="$(jq -r '.issue.title' "${EVENT_PATH}")"
          issue_body="$(jq -r '.issue.body // ""' "${EVENT_PATH}")"
          comment_body="$(jq -r '.comment.body // ""' "${EVENT_PATH}")"

          prompt=$(printf '%s\n' \
            'You are Hermes Agent operating in a GitHub repository through a trusted Issue.' \
            '' \
            "Repository: ${GITHUB_REPOSITORY}" \
            "Issue: #${ISSUE_NUMBER}" \
            "Title: ${issue_title}" \
            'Original issue body:' \
            "${issue_body}" \
            '' \
            'Latest comment (empty when this is a newly opened issue):' \
            "${comment_body}" \
            '' \
            'Work directly in the checked-out repository. Inspect the existing code before editing.' \
            'Implement the requested change when it is clear and safe. Run the narrowest relevant' \
            'tests or checks. Do not expose secrets, change workflow permissions, or modify files' \
            'outside this repository. Commit useful changes with a concise message. Finish with a' \
            'short summary of changes, tests run, and any remaining limitation for the Issue reply.')

          set +e
          docker exec -e GITHUB_TOKEN "${HERMES_AGENT_CONTAINER}" \
            hermes -z "${prompt}" chat \
            --in /workspace --no-restore-cwd \
            -t terminal,memory 2>&1 | tee hermes-output.txt
          status=${PIPESTATUS[0]}
          set -e

          {
            echo 'result<<HERMES_RESULT'
            tail -c 60000 hermes-output.txt
            echo
            echo 'HERMES_RESULT'
          } >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Persist Hermes home
        if: always()
        run: |
          set -euo pipefail
          git add .hermes
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "hermes-agent[bot]"
          git config user.email "hermes-agent[bot]@users.noreply.github.com"
          git commit -m "chore: persist Hermes state"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Reply on the Issue
        if: always() && steps.hermes.outputs.result != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.hermes.outputs.result }}
        run: |
          printf '## Hermes Agent (Docker)\n\n\\`\\`\\`\n%s\n\\`\\`\\`\n' "${RESULT}" |
            gh issue comment "${ISSUE_NUMBER}" --body-file -

      - name: Stop Hermes Docker services
        if: always()
        run: |
          docker rm -f "${HERMES_WEBUI_CONTAINER}" "${HERMES_AGENT_CONTAINER}" "${HERMES_PROXY_CONTAINER}" 2>/dev/null || true
          docker network rm "${HERMES_NETWORK}" 2>/dev/null || true
