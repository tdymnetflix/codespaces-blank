services:
  cf-proxy:
    image: nousresearch/hermes-agent:latest
    working_dir: /app
    entrypoint: ["python3"]
    volumes:
      - ./scripts/cf-proxy.py:/app/cf-proxy.py:ro
    environment:
      CF_PROXY_HOST: 0.0.0.0
      CF_PROXY_PORT: 8788
      CF_MODEL: ${CF_MODEL:-@cf/zai-org/glm-4.7-flash}
    command: ["/app/cf-proxy.py"]
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    depends_on:
      hermes-agent:
        condition: service_started
      cf-proxy:
        condition: service_healthy
    ports:
      - "${HERMES_WEBUI_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - ${HERMES_HOME:-${PWD}/.hermes}:/home/hermeswebui/.hermes
      - ${HERMES_WORKSPACE:-${PWD}}:/workspace
    environment:
      WANTED_UID: ${UID:-1000}
      WANTED_GID: ${GID:-1000}
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: 8787
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:-}
      HERMES_WEBUI_CHAT_BACKEND: gateway
      HERMES_WEBUI_GATEWAY_BASE_URL: http://hermes-agent:8642
      HERMES_WEBUI_GATEWAY_API_KEY: ${API_SERVER_KEY:-}
      HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
    restart: unless-stopped

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    depends_on:
      cf-proxy:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ${HERMES_HOME:-${PWD}/.hermes}:/opt/data
      - ${HERMES_WORKSPACE:-${PWD}}:/workspace
    environment:
      HERMES_HOME: /opt/data
      HERMES_WRITE_SAFE_ROOT: /opt/data
      HERMES_UID: ${UID:-1000}
      HERMES_GID: ${GID:-1000}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${API_SERVER_KEY:-}
    command: ["gateway", "run"]
    restart: unless-stopped